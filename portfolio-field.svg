<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="none" fill="none">
  <!-- Each route matches position, tangent and curvature at both tile edges. -->
  <style>
    path {vector-effect:non-scaling-stroke}
    .field-current {animation:field-stream-down 18s linear infinite}
    @keyframes field-stream-down {from{stroke-dashoffset:0}to{stroke-dashoffset:-240}}
    @media (prefers-reduced-motion:reduce) {.field-current{animation:none!important}}
  </style>
  <g class="field-routes" stroke="#709B88" stroke-width="1">
    <path d="M 620 0 C 620 200 1100 400 1100 600 C 1100 800 620 1000 620 1200" pathLength="1200" stroke-opacity=".44"/>
    <path d="M 644 0 C 644 200 1120 400 1120 600 C 1120 800 644 1000 644 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 668 0 C 668 200 1140 400 1140 600 C 1140 800 668 1000 668 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 692 0 C 692 200 1160 400 1160 600 C 1160 800 692 1000 692 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 716 0 C 716 200 1180 400 1180 600 C 1180 800 716 1000 716 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 740 0 C 740 200 1200 400 1200 600 C 1200 800 740 1000 740 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 764 0 C 764 200 1220 400 1220 600 C 1220 800 764 1000 764 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 788 0 C 788 200 1240 400 1240 600 C 1240 800 788 1000 788 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 812 0 C 812 200 1260 400 1260 600 C 1260 800 812 1000 812 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 836 0 C 836 200 1280 400 1280 600 C 1280 800 836 1000 836 1200" pathLength="1200" stroke-opacity=".44"/>
    <path d="M 860 0 C 860 200 1300 400 1300 600 C 1300 800 860 1000 860 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 884 0 C 884 200 1320 400 1320 600 C 1320 800 884 1000 884 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 908 0 C 908 200 1340 400 1340 600 C 1340 800 908 1000 908 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 932 0 C 932 200 1360 400 1360 600 C 1360 800 932 1000 932 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 956 0 C 956 200 1380 400 1380 600 C 1380 800 956 1000 956 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 980 0 C 980 200 1400 400 1400 600 C 1400 800 980 1000 980 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 1004 0 C 1004 200 1420 400 1420 600 C 1420 800 1004 1000 1004 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 1028 0 C 1028 200 1440 400 1440 600 C 1440 800 1028 1000 1028 1200" pathLength="1200" stroke-opacity=".23"/>
    <path d="M 1052 0 C 1052 200 1460 400 1460 600 C 1460 800 1052 1000 1052 1200" pathLength="1200" stroke-opacity=".44"/>
  </g>
  <!-- The 240-unit dot spacing divides the normalized 1200-unit route exactly. -->
  <g class="field-current" stroke="#5D8F77" stroke-width="3" stroke-dasharray="0.1 239.9" stroke-linecap="round" stroke-opacity=".68">
    <path d="M 620 0 C 620 200 1100 400 1100 600 C 1100 800 620 1000 620 1200" pathLength="1200"/>
    <path d="M 836 0 C 836 200 1280 400 1280 600 C 1280 800 836 1000 836 1200" pathLength="1200"/>
    <path d="M 1052 0 C 1052 200 1460 400 1460 600 C 1460 800 1052 1000 1052 1200" pathLength="1200"/>
  </g>
</svg>
