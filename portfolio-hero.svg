<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" fill="none">
  <style>
    .float,.pointer,.dot,.orbit{transform-box:fill-box;transform-origin:center}
    .float{animation:float 9s ease-in-out infinite}
    .pointer{animation:pointer 11s ease-in-out infinite}
    .dot{animation:dot 6s ease-in-out infinite}
    .orbit{animation:orbit 38s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes pointer{0%,100%{transform:translate(0,0)}45%{transform:translate(-9px,-7px)}75%{transform:translate(3px,-3px)}}
    @keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.float,.pointer,.dot,.orbit{animation:none!important}}
  </style>
