<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" fill="none">
  <style>
    .idea,.material,.finish{transform-box:fill-box;transform-origin:center}
    .idea{animation:idea 10s ease-in-out infinite}.material{animation:material 8s ease-in-out infinite}.finish{animation:finish 7s ease-in-out infinite}
    .route{stroke-dasharray:3 8;animation:route 28s linear infinite}
    @keyframes idea{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
    @keyframes material{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes finish{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
    @keyframes route{to{stroke-dashoffset:-154}}
    @media(prefers-reduced-motion:reduce){.idea,.material,.finish,.route{animation:none!important}}
  </style>
  <path class="route" d="M94 195c14-81 104-139 187-118 80 20 132 97 100 169-32 73-130 101-200 56" stroke="#709B88" stroke-width="1.6"/>
