    <path d="m254 215 10-11 8 15 12-22 12 12" stroke="#B6F4C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m226 259 63 4m-64 10 93 6" stroke="#709B88" stroke-width="2"/>
